<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
main{
    display:flex;
}
.trai{
    width: 75%;
    
    display: flex;
    justify-content: center;
    align-items: center;
}
.phai{
    width: 25%;
    height:500px;
    border: 1px solid black;
    text-align: center;
    border-radius: 10px;
}
.video{
    width: 90%;
    height: 450px;
    background-color: black;
    border-radius: 20px;
    
}
.bai-hat{
    width: 95%;
    height: 80px;
    margin: 10px auto;
    background-color: aqua;
    display: flex;
    align-items: center;
}
.bai-hat:hover{
    background-color: gray;
}
img{
    width: 20%;
    margin-right: 10px;
}
p{
    width: 75%;
}
iframe{
    width: 80%;
    height:500px ;
}

    </style>
</head>
<body>
    <main>
    <div class="trai">
        <!--<div class="video"></div>-->
    <iframe class="video"
    src="https://www.youtube.com/embed/9mA7h1jfxc8"
    title="YouTube video player"
    allowfullscreen>
</iframe>
    </div>

    <div class="phai">
        <h1>Danh sach</h1>
        <div class="danhsach">
            <div onclick="chonbai(1)" class="bai-hat">
                <img class="anh-bai" src="../anh/suyt.jpg">
                <p>Suýt</p>
            </div>
            <div onclick="chonbai(2)" class="bai-hat">
                <img class="anh-bai" src="../anh/gieo.jpg">
                <p>Gieo</p>
            </div>
            <div onclick="chonbai(3)" class="bai-hat">
                <img class="anh-bai" src="../anh/lamgi.png">
                <p>Chuyển kênh</p>
            </div>
            <div onclick="chonbai(4)" class="bai-hat">
                <img class="anh-bai" src="../anh/ngbth.jpg">
                <p>Ngbth</p>
            </div>
        </div>
    </div>
</main>
<script>
    
    var danhsachVid =[
       { id:1,
        ten: "Suyt",
        duongdanhanh: "../anh/suyt.jpg",
        linkyo: "https://www.youtube.com/embed/9mA7h1jfxc8",
    },
    {
        id:2,
        ten: "Gieo",
        duongdanhanh: "../anh/gieo.jpg",
        linkyo: "https://www.youtube.com/embed/hgWCbU2FU_8",
    },
    {
        id:3,
        ten: "lamgi",
        duongdanhanh: "../anh/lamgi.png",
        linkyo: "https://www.youtube.com/embed/RkXStDkolwE",
    },
    {
        id:4,
        ten: "ngbth",
        duongdanhanh: "../anh/ngbth.jpg",
        linkyo: "https://www.youtube.com/embed/gNvsbLKnlmE",
    }
];
function chonbai(id){
     for (let i = 0; i< danhsachVid.length;i++){
        if(danhsachVid[i].id == id){
            document.getElementsByClassName("video")[0].src = danhsachVid[i].linkyo;
        }
     }

}


</script>
</body>
</html>
